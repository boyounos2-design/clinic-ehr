# Clinic EHR - run with:  docker compose up -d --build
# HTTPS is handled by Caddy (automatic Let's Encrypt certificate) once DOMAIN points at this server.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ehr_data:/data          # database + uploaded files + keys: BACK THIS UP
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  ehr_data:
  caddy_data:
